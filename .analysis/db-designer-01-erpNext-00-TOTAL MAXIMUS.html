    This file visualizes the comprehensive architecture of the ERPNext system. The platform is built on the Frappe Framework, which follows a "metadata-driven" or "model-view-controller-like" architecture. The core principle is "Everything is a DocType," where both master data (like Customers, Items) and transactional data (like Sales Invoices) are defined as DocTypes, creating a consistent and highly extensible system.

    **Overall Architectural Philosophy:**
    ERPNext's architecture is defined by the Frappe Framework's "DocType" concept, which separates a business object's definition into three key files: a Python file for server-side logic, a JSON file for the data schema, and a JavaScript file for client-side behavior. This modular "DocType Trio" is the fundamental building block of the entire system.

    - **DocType Trio (The Core Pattern):**
        - **Model/Schema (`.json`):** This file defines the database table for a DocType, including its fields, data types, links to other DocTypes, permissions, and UI properties. It is the single source of truth for the data model.
        - **Controller/Backend Logic (`.py`):** This Python class, inheriting from `frappe.model.document.Document`, contains all server-side business logic. It handles validation (`validate`), lifecycle hooks (`on_submit`, `on_cancel`), and interactions with other system components.
        - **View/Client-Side Logic (`.js`):** This file controls the frontend behavior of a DocType's form, handling UI events (`onload`, `refresh`), custom button logic, fetching data for dynamic fields, and client-side validation.

    - **Inheritance and Code Reusability:** A powerful architectural feature is the use of controller class inheritance. Core business logic is encapsulated in base classes (e.g., `AccountsController`, `StockController`), which are then inherited by transactional DocTypes. For example, `SellingController` inherits from `StockController`, which itself inherits from `AccountsController`. This creates a layered, reusable, and maintainable codebase where common functions like updating the stock ledger or creating general ledger entries are defined once.

    - **Data-Driven Configuration and Localization:** Much of the system's flexibility comes from its data-driven nature. Internationalization, for instance, is not hard-coded. Country-specific "Chart of Accounts" are defined as `.json` files that can be imported during setup. Similarly, UI text labels and messages are translated via `.po` and `.pot` files, allowing the entire application to be localized without changing core code.

    - **Event-Driven Programming with Hooks:** The `hooks.py` file in each app acts as a central dispatcher for the system. It maps DocType events (e.g., `on_submit` for a `SalesInvoice`) to specific Python functions, registers scheduled jobs, and includes necessary JS/CSS files. This provides a clean mechanism for extending and integrating different modules.

    **Key File Types and Their Roles:**
    - **Python Files (`.py`):**
        - **DocType Logic (`sales_invoice.py`):** Contains the primary Python class for a DocType, handling its backend logic and state transitions.
        - **Controller Classes (`stock_controller.py`):** Base classes providing shared methods for a group of related DocTypes (e.g., all transactions affecting inventory).
        - **Core Utilities & Reports (`general_ledger.py`, `party.py`):** Contain shared business logic, queries, and the backend code for generating script reports.
        - **Patches:** Scripts located in `patches/` folders that handle data migration and schema updates between different versions of ERPNext.

    - **JSON Files (`.json`):**
        - **DocType Schema (`sales_invoice.json`):** Defines the fields, data types, relationships (links), and permissions for a DocType.
        - **Configuration & Data (`manufacturing.json`, `de_skr03.json`):** Define Workspace layouts, dashboards, and data templates like country-specific Chart of Accounts.
        - **Onboarding Steps:** Small JSON files that provide guided setup instructions for new users.

    - **JavaScript Files (`.js`):**
        - **DocType UI Logic (`sales_invoice.js`):** Manages the frontend behavior and user interactions for a specific DocType form.
        - **Page Scripts (`point_of_sale.js`):** Provide the logic for complex, single-page applications like the Point of Sale interface.
        - **Query Reports (`sales_analytics.js`):** Define the frontend filters and formatting for script reports.

    - **Configuration & Service Files:**
        - `pyproject.toml` / `package.json`: Define Python and JavaScript library dependencies.
        - `.po` / `.pot` Files: Contain the source text and translations for internationalization (i18n), enabling the entire UI to be displayed in multiple languages.
        - DevOps Files (`.mergify.yml`, `.pre-commit-config.yaml`): Automate development processes like merging pull requests and code quality checks.

    **Key Business Process Flows:**
    - **Order-to-Cash Cycle:**
        1.  A **Lead** or **Opportunity** is captured in the CRM module.
        2.  A **Quotation** is created and submitted to the customer.
        3.  Upon acceptance, a **Sales Order** is created. This document uses the `SellingController` and `StockController` to reserve inventory if configured.
        4.  A **Delivery Note** is created from the Sales Order, which triggers the `StockController` to update the `Stock Ledger` and decrease inventory levels.
        5.  A **Sales Invoice** is created, which uses the `AccountsController` to post entries to the **General Ledger** (debiting Accounts Receivable, crediting Income).
        6.  Finally, a **Payment Entry** is made against the Sales Invoice, clearing the receivable and debiting a bank account.

    - **Procure-to-Pay Cycle:**
        1.  A **Material Request** can be generated manually or from a Sales Order.
        2.  This leads to a **Purchase Order** being sent to a **Supplier**.
        3.  Goods are received via a **Purchase Receipt**, which uses the `StockController` to update the `Stock Ledger` and increase inventory.
        4.  A **Purchase Invoice** is created against the Purchase Order or Receipt, using the `AccountsController` to post to the **General Ledger** (crediting Accounts Payable).

    - **Manufacturing Flow:**
        1.  A **Production Plan** can be generated from Sales Orders or a **Sales Forecast**.
        2.  The Production Plan creates one or more **Work Orders** for the finished goods.
        3.  The Work Order pulls the material list from a **Bill of Materials (BOM)**.
        4.  Manufacturing is executed through **Stock Entry** transactions with a purpose of "Material Transfer for Manufacture" (to move raw materials to a Work-in-Progress warehouse) and "Manufacture" (to consume raw materials and create the finished good). These entries heavily interact with the `StockController` and `Stock Ledger`.
        5.  **Job Cards** and **Timesheets** can be used to track operational time and cost.

// ===================================================================================
//  RENDERING LOGIC
// ===================================================================================
function initializeCanvas(canvasId, schema) {
    const canvas = document.getElementById(canvasId);
    if (!canvas) return;
    const transformContainer = canvas.querySelector('.transform-container');
    const svg = canvas.querySelector('.connections');
    let state = { scale: 0.7, panX: 50, panY: 50, isPanning: false, lastMouse: { x: 0, y: 0 } };

    function render() {
        if (!transformContainer || !svg) return;
        transformContainer.innerHTML = '';
        transformContainer.style.transform = `translate(${state.panX}px, ${state.panY}px) scale(${state.scale})`;
        
        schema.tables.forEach(table => {
            const node = document.createElement('div');
            node.id = `${canvasId}-${table.id}`;
            node.classList.add('node', `${table.nodeType}-node`);
            node.style.left = `${table.pos.x}px`;
            node.style.top = `${table.pos.y}px`;

            const header = document.createElement('h3');
            const pathSpan = table.path ? `<span class="path">${table.path}</span>` : '';
            header.innerHTML = `${table.name}${pathSpan}`;

            const list = document.createElement('ul');
            list.innerHTML = table.columns.map(col => {
                const colName = typeof col === 'string' ? col : col.name;
                const colType = typeof col === 'string' ? '' : (col.type || '');
                const colId = colName.replace(/\s+/g, '-').replace(/[^\w-]/g, '');
                return `<li id="${canvasId}-${table.id}-${colId}"><span class="col-name">${colName}</span>${colType ? `<span class="col-type">${colType}</span>` : ''}</li>`;
            }).join('');
            
            if (table.icon) {
                const iconDisplay = document.createElement('div');
                iconDisplay.className = 'icon-display';
                iconDisplay.textContent = table.icon;
                node.appendChild(iconDisplay);
            }

            node.appendChild(header);
            node.appendChild(list);
            transformContainer.appendChild(node);
        });
        updateConnections();
    }
    
    function getElementPortPosition(elId) {
        const el = document.getElementById(elId);
        if (!el) return null;
        const parentNode = el.closest('.node');
        if (!parentNode) return null;
        const isNodeConnection = el.classList.contains('node');
        
        const parentRect = parentNode.getBoundingClientRect();
        const elRect = isNodeConnection ? parentRect : el.getBoundingClientRect();
        const canvasRect = canvas.getBoundingClientRect();
        
        const y = isNodeConnection ? (parentRect.top - canvasRect.top + parentRect.height / 2) : (elRect.top - canvasRect.top + elRect.height / 2);
        const leftX = (parentRect.left - canvasRect.left);
        const rightX = (parentRect.right - canvasRect.left);

        return { left: {x: leftX, y: y}, right: {x: rightX, y: y} };
    }

    function updateConnections() {
        if (!svg) return;
        svg.innerHTML = `<defs>
            <marker id="arrowhead-read-${canvasId}" markerWidth="10" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#6b7283" /></marker>
            <marker id="arrowhead-write-${canvasId}" markerWidth="12" markerHeight="9" refX="10" refY="4.5" orient="auto"><polygon points="0 0, 12 4.5, 0 9" fill="#86efac" /></marker>
            <marker id="arrowhead-flow-${canvasId}" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#9ca3af" /></marker>
        </defs>`;
        
        const idMap = new Map(schema.tables.map(t => [t.name, t.id]));

        schema.relationships.forEach(rel => {
            const fromTableName = typeof rel.from === 'string' ? rel.from : rel.from.table;
            const toTableName = typeof rel.to === 'string' ? rel.to : rel.to.table;

            const fromId = idMap.get(fromTableName);
            const toId = idMap.get(toTableName);
            if(!fromId || !toId) return;

            let fromColName = (typeof rel.from === 'object' && rel.from.column) ? (typeof rel.from.column === 'string' ? rel.from.column : (rel.from.column.name || '')) : '';
            let toColName = (typeof rel.to === 'object' && rel.to.column) ? (typeof rel.to.column === 'string' ? rel.to.column : (rel.to.column.name || '')) : '';
            
            let fromElId = fromColName ? `${canvasId}-${fromId}-${fromColName.replace(/\s+/g, '-').replace(/[^\w-]/g, '')}` : `${canvasId}-${fromId}`;
            if (!document.getElementById(fromElId)) fromElId = `${canvasId}-${fromId}`;

            let toElId = toColName ? `${canvasId}-${toId}-${toColName.replace(/\s+/g, '-').replace(/[^\w-]/g, '')}` : `${canvasId}-${toId}`;
            if (!document.getElementById(toElId)) toElId = `${canvasId}-${toId}`;
            
            const fromPorts = getElementPortPosition(fromElId);
            const toPorts = getElementPortPosition(toElId);
            if (!fromPorts || !toPorts) return;

            const fromPos = toPorts.right.x < fromPorts.left.x ? fromPorts.left : fromPorts.right;
            const toPos = toPorts.right.x < fromPorts.left.x ? toPorts.right : toPorts.left;
            
            const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
            line.setAttribute('x1', fromPos.x); line.setAttribute('y1', fromPos.y);
            line.setAttribute('x2', toPos.x); line.setAttribute('y2', toPos.y);

            const type = rel.type || 'read';

            if (type === 'write') {
                line.setAttribute('stroke', '#86efac'); line.setAttribute('stroke-width', 4); line.setAttribute('marker-end', `url(#arrowhead-write-${canvasId})`);
            } else if (type === 'flow') {
                line.setAttribute('stroke', '#9ca3af'); line.setAttribute('stroke-width', 2); line.setAttribute('stroke-dasharray', `6,6`); line.setAttribute('marker-end', `url(#arrowhead-flow-${canvasId})`);
            } else {
                line.setAttribute('stroke', '#6b7283'); line.setAttribute('stroke-width', 2); line.setAttribute('marker-end', `url(#arrowhead-read-${canvasId})`);
            }
            svg.appendChild(line);
        });
    }
    
    let activeNode = null, offset = { x: 0, y: 0 };
    canvas.addEventListener('mousedown', (e) => {
        const targetNode = e.target.closest('.node');
        if (targetNode) {
            activeNode = targetNode;
            const tableData = schema.tables.find(t => `${canvasId}-${t.id}` === activeNode.id);
            if (!tableData) return;
            const mouseX = (e.clientX - canvas.getBoundingClientRect().left - state.panX) / state.scale;
            const mouseY = (e.clientY - canvas.getBoundingClientRect().top - state.panY) / state.scale;
            offset.x = mouseX - tableData.pos.x;
            offset.y = mouseY - tableData.pos.y;
            activeNode.style.zIndex = 11;
        } else {
            state.isPanning = true;
            state.lastMouse.x = e.clientX;
            state.lastMouse.y = e.clientY;
        }
    });

    document.addEventListener('mousemove', (e) => {
        if (activeNode) {
            e.preventDefault();
            const mouseX = (e.clientX - canvas.getBoundingClientRect().left - state.panX) / state.scale;
            const mouseY = (e.clientY - canvas.getBoundingClientRect().top - state.panY) / state.scale;
            const tableData = schema.tables.find(t => `${canvasId}-${t.id}` === activeNode.id);
            if (tableData) {
                tableData.pos.x = mouseX - offset.x;
                tableData.pos.y = mouseY - offset.y;
                activeNode.style.left = `${tableData.pos.x}px`;
                activeNode.style.top = `${tableData.pos.y}px`;
                updateConnections();
            }
        } else if (state.isPanning) {
            e.preventDefault();
            const dx = e.clientX - state.lastMouse.x;
            const dy = e.clientY - state.lastMouse.y;
            state.panX += dx;
            state.panY += dy;
            transformContainer.style.transform = `translate(${state.panX}px, ${state.panY}px) scale(${state.scale})`;
            updateConnections();
            state.lastMouse.x = e.clientX;
            state.lastMouse.y = e.clientY;
        }
    });
    
    document.addEventListener('mouseup', () => {
        if (activeNode) { activeNode.style.zIndex = 10; activeNode = null; }
        state.isPanning = false;
    });
    
    canvas.addEventListener('wheel', (e) => {
        e.preventDefault();
        const rect = canvas.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;
        const mouseY = e.clientY - rect.top;
        const oldScale = state.scale;
        const zoomFactor = 1.1;
        state.scale *= e.deltaY < 0 ? zoomFactor : 1 / zoomFactor;
        state.scale = Math.max(0.1, Math.min(state.scale, 2.5));
        state.panX = mouseX - (mouseX - state.panX) * (state.scale / oldScale);
        state.panY = mouseY - (mouseY - state.panY) * (state.scale / oldScale);
        render();
    });

    render();
    return { render, updateConnections };
}

const canvases = [
    initializeCanvas('canvas-r2', schemaR2),
    initializeCanvas('canvas-r3', schemaR3),
    initializeCanvas('canvas-r4', schemaR4)
];

document.querySelectorAll('.splitter').forEach(splitter => {
    splitter.addEventListener('mousedown', (e) => {
        e.preventDefault();
        const prevPanel = splitter.previousElementSibling;
        const startX = e.clientX;
        const initialPrevWidth = prevPanel.getBoundingClientRect().width;
        
        const onMouseMove = (moveEvent) => {
            let newPrevWidth = initialPrevWidth + (moveEvent.clientX - startX);
            const MIN_WIDTH = 150;
            if (newPrevWidth < MIN_WIDTH) newPrevWidth = MIN_WIDTH;
            prevPanel.style.flex = `0 0 ${newPrevWidth}px`;
            canvases.forEach(c => c && c.render());
        };
        const onMouseUp = () => {
            document.removeEventListener('mousemove', onMouseMove);
            document.removeEventListener('mouseup', onMouseUp);
        };
        document.addEventListener('mousemove', onMouseMove);
        document.addEventListener('mouseup', onMouseUp);
    });
});

window.addEventListener('resize', () => {
    canvases.forEach(c => c && c.render());
});
</script>
